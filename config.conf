# ============================================
# ADB 层优化开关（Android 12+ 主力）
# ============================================
ENABLE_ADB_GAME_MODE=1        # 游戏模式切换
ENABLE_ADB_FIXED_PERF=1       # 固定性能模式
ENABLE_ADB_UCLAMP=1           # UClamp 调度
ENABLE_ADB_CGROUP=1           # CGroup 迁移
ENABLE_ADB_FREEZER=1          # 后台冻结
ENABLE_ADB_REFRESH=1          # 刷新率锁定
ENABLE_ADB_NET_POLICY=1       # 网络策略

# 刷新率目标
TARGET_REFRESH_RATE=120